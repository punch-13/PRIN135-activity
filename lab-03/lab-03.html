<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Audio and Video Lab</title>
</head>

<body>

    <h1>KRONG</h1>

    <section>
        <h2>Video Playing</h2>

        <video 
        width="640"
        height="340" 
        controls>
            <source
                src="https://cdn.freecodecamp.org/curriculum/labs/working-with-video-elements.mp4"
                type="video/mp4">
        </video>
    </section>

    <section>
        <h2>Audio Playing</h2>

        <audio
            controls
            loop
            src="https://cdn.freecodecamp.org/curriculum/js-music-player/cantinaBand.mp3">
        </audio>
    </section>

</body>

</html>
